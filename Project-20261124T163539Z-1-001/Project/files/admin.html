<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอดมิน – หารถที่จอด</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="pbadge">P</div>
      <div><b>หลังบ้านลานจอด</b><span>จัดการข้อมูลรถ</span></div>
      <a class="back" href="index.html">← หน้าค้นหา</a>
    </div>
    <h1>แอดมิน</h1>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="banner" class="card banner-err" role="alert" hidden></div>

    <div class="login card" id="loginView">
      <div class="lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <p>กรอกรหัสผ่านแอดมินเพื่อเพิ่มหรือลบข้อมูลรถ</p>
      <input type="password" id="pw" placeholder="รหัสผ่านแอดมิน" aria-label="รหัสผ่านแอดมิน" autocomplete="current-password">
      <button class="go" id="loginBtn">เข้าสู่ระบบ</button>
      <p class="err" id="loginErr" role="alert"></p>
      <p class="note">รหัสผ่านถูกส่งให้เซิร์ฟเวอร์ตรวจเมื่อสั่งเพิ่มหรือลบ และจำไว้ในแท็บนี้จนกว่าจะปิดแท็บหรือออกจากระบบ</p>
    </div>

    <div id="panelView" hidden>
      <div class="row"><button class="alt" id="reloadBtn">โหลดข้อมูลใหม่</button></div>

      <div class="card">
        <h3 class="ft">เพิ่มรถด้วยตนเอง</h3>
        <input class="fld" id="newPlate" placeholder="ป้ายทะเบียน เช่น กท 1234" autocomplete="off" aria-label="ป้ายทะเบียนที่จะเพิ่ม">
        <div class="sel">
          <select class="fld" id="newFloor" aria-label="ชั้น"></select>
          <select class="fld" id="newZone" aria-label="โซน"></select>
          <select class="fld" id="newSlot" aria-label="ช่องจอด"></select>
        </div>
        <label class="flabel" for="newPhoto">รูปถ่ายรถหรือช่องจอด (ไม่บังคับ)</label>
        <input class="fld" type="file" id="newPhoto" accept="image/*">
        <img class="preview" id="preview" alt="ตัวอย่างรูปที่เลือก" hidden>
        <div class="row" style="margin:12px 0 0"><button id="addBtn">เพิ่มรถ</button></div>
        <p role="status" id="msg"></p>
      </div>

      <h3 class="ft">รถที่จอดอยู่ทั้งหมด</h3>
      <div class="card" style="padding:6px 16px"><ul class="list" id="carList"></ul></div>
      <div class="row"><button class="alt" id="logoutBtn">ออกจากระบบ</button></div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
